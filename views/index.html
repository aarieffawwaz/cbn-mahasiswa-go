<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>List Mahasiswa</title>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Go CBN-Mahasiswa</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between">
            <h3>List Mahasiswa</h3>
            <a href="/mahasiswa/create" class="btn btn-sm btn-primary d-flex justify-content-center align-items-center">Add Data</a>
        </div>

        <div class="my-3">
            <label for="entries" class="form-label">Show</label>
            <select id="entries" class="form-select w-auto d-inline-block">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="10">10</option>
            </select>
            <span>entries</span>
        </div>

        <table class="table my-4" id="dataTable">
            <thead>
                <tr>
                    <td>Nama</td>
                    <td>NIM</td>
                    <td>Alamat</td>
                    <td>Action</td>
                </tr>
            </thead>
            <tbody>
                {{ range $index, $mahasiswa := .mahasiswas }}
                <tr>
                    <td>{{ $mahasiswa.Name }}</td>
                    <td>{{ $mahasiswa.NIM }}</td>
                    <td>{{ $mahasiswa.Alamat }}</td>
                    <td>
                        <a href="/mahasiswa/update?id={{ $mahasiswa.ID }}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="/mahasiswa/delete?id={{ $mahasiswa.ID }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {{ end }}
            </tbody>
        </table>

        <div class="d-flex justify-content-center">
            <nav>
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const select = document.getElementById("entries");
            const table = document.getElementById("dataTable");
            const rows = Array.from(table.getElementsByTagName("tbody")[0].rows);
            const pagination = document.getElementById("pagination");
            
            let currentPage = 1;
            let rowsPerPage = parseInt(select.value);

            function updateTable() {
                rowsPerPage = parseInt(select.value);
                let totalPages = Math.ceil(rows.length / rowsPerPage);
                if (currentPage > totalPages) currentPage = totalPages || 1;
                
                rows.forEach((row, index) => {
                    row.style.display = (index >= (currentPage - 1) * rowsPerPage && index < currentPage * rowsPerPage) ? "table-row" : "none";
                });
                
                updatePagination(totalPages);
            }
            
            function updatePagination(totalPages) {
                pagination.innerHTML = "";
                for (let i = 1; i <= totalPages; i++) {
                    let li = document.createElement("li");
                    li.classList.add("page-item");
                    if (i === currentPage) li.classList.add("active");
                    let a = document.createElement("a");
                    a.classList.add("page-link");
                    a.href = "#";
                    a.textContent = i;
                    a.addEventListener("click", function(e) {
                        e.preventDefault();
                        currentPage = i;
                        updateTable();
                    });
                    li.appendChild(a);
                    pagination.appendChild(li);
                }
            }
            
            select.addEventListener("change", updateTable);
            updateTable();
        });
    </script>
  </body>
</html>
